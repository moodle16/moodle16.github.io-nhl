name: Test Highlightly

# Len ručné spustenie – jednorazový test Highlightly Hockey API.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/highlightly-test.mjs
        env:
          HIGHLIGHTLY_API: ${{ secrets.HIGHLIGHTLY_API }}
