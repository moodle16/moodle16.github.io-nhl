name: Test API-Sports

# Len ručné spustenie – jednorazový test európskych líg (fáza 1).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apisports-test.mjs
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
