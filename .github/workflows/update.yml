name: Aktualizácia dát

on:
  # NHL zápasy končia v našom čase skoro ráno. Časy Europe/Bratislava v zime
  # (GitHub plánuje v UTC, v lete behy pobežia o hodinu neskôr): 05:10, 07:40, 10:10, 23:40.
  schedule:
    - cron: '10 4 * * *'
    - cron: '40 6 * * *'
    - cron: '10 9 * * *'
    - cron: '40 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Nikdy nebežia dva behy naraz (inak by sa bili pri pushi).
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Uloženie data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Žiadna zmena v dátach."
            exit 0
          fi
          git commit -m "Aktualizácia dát"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
