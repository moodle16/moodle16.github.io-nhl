name: Aktualizácia európskych líg

# Rozvrh (čas Europe/Bratislava v zime; GitHub plánuje v UTC, v lete behy pobežia o hodinu neskôr):
#   07:10 denne  – všetky ligy: výsledky, rozpis, tabuľky   ("10 6 * * *")
#   21:10 denne  – ligy, ktoré dnes hrajú                    ("10 20 * * *")
#   22:50 denne  – ligy, ktoré dnes hrajú + ich tabuľky      ("50 21 * * *")
#   19:10 so, ne – ligy, ktoré dnes hrajú                    ("10 18 * * 6,0")
on:
  schedule:
    - cron: '10 6 * * *'
    - cron: '10 20 * * *'
    - cron: '50 21 * * *'
    - cron: '10 18 * * 6,0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Režim (morning = všetko, late = dnešné ligy + tabuľky, evening = dnešné ligy)'
        default: morning
        type: choice
        options: [morning, late, evening, weekend]

permissions:
  contents: write

concurrency:
  group: update-eu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Výber režimu
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$SCHED" in
            "10 20 * * *")   MODE=evening ;;
            "50 21 * * *")   MODE=late ;;
            "10 18 * * 6,0") MODE=weekend ;;
            "10 6 * * *")    MODE=morning ;;
            *)               MODE="${INPUT_MODE:-morning}" ;;
          esac
          echo "Režim: $MODE"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
      - run: node scripts/update-eu.mjs
        env:
          HIGHLIGHTLY_API: ${{ secrets.HIGHLIGHTLY_API }}
      - name: Uloženie data-eu.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data-eu.json
          if git diff --cached --quiet; then
            echo "Žiadna zmena v dátach."
            exit 0
          fi
          git commit -m "Aktualizácia európskych líg"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
